<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#b3002d, #ffccd5);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.section{
  display:none;
  padding:60px 20px;
  min-height:100vh;
}

.active{ display:block; }

button{
  font-size:20px;
  padding:14px 28px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  margin:10px;
}

.yes{ background:#2ecc71; color:white; }
.no{
  background:#e74c3c;
  color:white;
  position:absolute;
}

#letterBox{
  max-width:720px;
  margin:0 auto;
  background:rgba(255,255,255,0.18);
  padding:30px;
  border-radius:16px;
  text-align:left;
  max-height:65vh;
  overflow-y:auto;
  display:none;
  line-height:1.6;
  white-space:pre-wrap;
}

#imageReveal{
  display:none;
}

#imageReveal img{
  max-width:90%;
  border-radius:20px;
  animation: fadeIn 3s;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.balloon{
  width:80px;
  height:100px;
  background:#ff4d6d;
  border-radius:50%;
  position:absolute;
  bottom:-120px;
  animation: float 10s linear infinite;
  cursor:pointer;
}

@keyframes float{
  from{ transform:translateY(0); }
  to{ transform:translateY(-120vh); }
}

#reasonBox{
  font-size:22px;
  margin-top:30px;
}

/* FINAL POPUP */
#finalPopup{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#finalPopup h1{
  color:#ffccd5;
  font-size:36px;
  max-width:90%;
  animation: fadeIn 3s;
}
</style>
</head>

<body>

<div id="finalPopup">
  <h1>I LOVE YOU, RITU AGARWAL,<br>MY ROCKSTAR ❤️</h1>
</div>

<!-- SECTION 1 -->
<div id="s1" class="section active">
  <h1>Ritu, will you be my Valentine? ❤️</h1>
  <button class="yes" onclick="goTo('s2')">YES</button>
  <button class="no" id="no1">NO</button>
</div>

<!-- SECTION 2 -->
<div id="s2" class="section">
  <h1>Will you marry me, my love? 💍</h1>
  <button class="yes" onclick="goTo('s3')">YES</button>
  <button class="no" id="no2">NO</button>
</div>

<!-- SECTION 3 -->
<div id="s3" class="section">
  <h2>Thank you for always choosing us ❤️</h2>
  <button class="yes" onclick="openLetter()">💌 Open to reveal letter</button>
</div>

<!-- SECTION 4 -->
<div id="s4" class="section">
  <div id="letterBox"></div>
  <br>
  <button class="yes" onclick="showImage()">Tap to reveal my favourite view</button>
</div>

<!-- SECTION 5 -->
<div id="s5" class="section">
  <div id="imageReveal">
    <img src="her.jpg">
  </div>
  <br>
  <button class="yes" onclick="startBalloons()">Do you want to know why? 🎈</button>
</div>

<!-- SECTION 6 -->
<div id="s6" class="section">
  <h2>Tap the balloons ❤️</h2>
  <div id="reasonBox"></div>
</div>

<iframe id="music" width="0" height="0" allow="autoplay"></iframe>

<script>
function goTo(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function moveNo(btn){
  btn.style.left = Math.random()*70 + "vw";
  btn.style.top = Math.random()*70 + "vh";
}

['no1','no2'].forEach(id=>{
  let b=document.getElementById(id);
  b.onmouseover=()=>moveNo(b);
  b.ontouchstart=()=>moveNo(b);
});

const letterText = `THANK YOU FOR CHOOSING ME.

My love, meeting you was unexpected in the most beautiful way. I found you when I was not even looking, when I had quietly given up on love, and then you arrived and changed everything. You did not simply enter my life, you elevated it.

Loving you has made me calmer, kinder, and better.

You are extraordinary in every sense. Incredibly talented, breathtakingly beautiful, undeniably hot and effortlessly sexy. And your voice… it deserves its own audience.

You are my favourite person, my safe place, and my home.

Forever sounds incredible. Especially now that it is us.

I LOVE YOU! ❤️

Love,
V`;

function openLetter(){
  goTo('s4');
  document.getElementById('music').src =
  "https://www.youtube.com/embed/7z8qwMTJQao?autoplay=1";

  let box=document.getElementById('letterBox');
  box.style.display="block";
  box.innerText="";

  let i=0;
  let interval=setInterval(()=>{
    box.innerText += letterText.charAt(i);
    box.scrollTop = box.scrollHeight;
    i++;
    if(i>=letterText.length) clearInterval(interval);
  },35);
}

function showImage(){
  goTo('s5');
  document.getElementById('imageReveal').style.display="block";
}

const reasons=[
"Because you feel like home",
"Because you believe in me",
"Because your smile fixes everything",
"Because life feels lighter with you",
"Because loving you feels effortless",
"Because even silence with you feels right"
];

let rIndex=0;

function startBalloons(){
  goTo('s6');
  for(let i=0;i<6;i++){
    let b=document.createElement('div');
    b.className="balloon";
    b.style.left=Math.random()*80+"vw";
    b.onclick=()=>{
      if(rIndex<reasons.length){
        document.getElementById('reasonBox').innerText = reasons[rIndex];
        rIndex++;
        if(rIndex===reasons.length){
          setTimeout(()=>{
            document.getElementById('finalPopup').style.display="flex";
          },10000);
        }
      }
      b.remove();
    };
    document.body.appendChild(b);
  }
}
</script>

</body>
</html>
